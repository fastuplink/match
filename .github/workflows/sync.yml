name: Sync Football Fixtures

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run fixtures sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run sync

      - name: Commit and push updated fixtures
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --staged --quiet; then
            echo "No changes detected in match fixtures."
          else
            git commit -m "chore: auto-sync football fixtures [skip ci]"
            git push
          fi
